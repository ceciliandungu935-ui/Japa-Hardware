<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" href="Hardware shit/Hardware shit/location logo.png">
    
    <title>Our Loction - Japa Hardware</title>

<style>


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Poppins", Arial, sans-serif;
    background: bisque;
    color: black;
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}

img {
    width: 100%;
    display: block;
}


.navbar {
    height: 95px;
    background: #101010;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    border-bottom: 1px solid #242424;
}

.logo {
    font-family: "Brush Script MT", cursive;
    font-size: 38px;
    color: #ffffff;
}

.logo span {
    color: #cda79b;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 45px;
}

.nav-links a {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #f4f1ef;
    transition: 0.3s ease;
}

.nav-links a:hover,
.nav-links a.active {
    color: #d6afa2;
}

.nav-icons {
    display: flex;
    gap: 25px;
    font-size: 23px;
}

.location-hero {
    height: 360px;
    position: relative;
    background:
        linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.88),
            rgba(0, 0, 0, 0.45),
            rgba(0, 0, 0, 0.15)
        ),
        url("images/store.jpg");

    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    padding: 0 8%;
}

.hero-content {
    max-width: 600px;
}

.hero-small {
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 20px;
}

.hero-title {
    font-family: Georgia, serif;
    font-size: clamp(55px, 7vw, 90px);
    font-weight: 400;
    line-height: 1;
    margin-bottom: 25px;
}

.hero-description {
    font-size: 16px;
    color: #ddd;
    max-width: 500px;
}

.location-section {
    max-width: 1200px;
    margin: auto;
    padding: 75px 6%;
}

.location-grid {
    display: grid;
    grid-template-columns: 0.8fr 1.2fr;
    gap: 70px;
    align-items: start;
}


.section-title {
    font-family: "Brush Script MT", cursive;
    font-size: 58px;
    font-weight: 400;
    margin-bottom: 40px;
}

.info-item {
    display: flex;
    gap: 25px;
    margin-bottom: 35px;
}

.info-icon {
    min-width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #cda79b;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 19px;
}

.info-content h4 {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
    color: #ddd;
}

.info-content p {
    color: #c9c5c2;
    font-size: 14px;
    line-height: 1.8;
}

.visit-message {
    font-family: "Brush Script MT", cursive;
    color: #cda79b;
    font-size: 31px;
    margin-top: 45px;
}


.map-container {
    width: 100%;
    height: 400px;
    overflow: hidden;
    border-radius: 8px;
    border: 1px solid #333;
}

.map-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
    filter: grayscale(80%) contrast(90%);
}


.directions-btn {
    width: 100%;
    margin-top: 25px;
    height: 55px;
    border: none;
    border-radius: 8px;
    background: #d9b9ae;
    color: #151515;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: 0.3s ease;
}

.directions-btn:hover {
    background: #ffffff;
    transform: translateY(-2px);
}

.map-note {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 18px;
}


.store-image {
    margin-top: 35px;
    height: 170px;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
}

.store-image img {
    height: 100%;
    object-fit: cover;
}

.store-image::after {
    content: "SEE YOU SOON ♡";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.45);

    color: white;
    font-family: "Brush Script MT", cursive;
    font-size: 32px;
}



footer {
    background: #101010;
    border-top: 1px solid #292929;
    padding: 55px 7% 25px;
}

.footer-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr 1.2fr;
    gap: 50px;
}

.footer-logo {
    font-family: "Brush Script MT", cursive;
    font-size: 36px;
}

.footer-column h3 {
    color: #d9b9ae;
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 20px;
    text-transform: uppercase;
}

.footer-column a {
    display: block;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 9px;
    transition: 0.3s;
}

.footer-column a:hover {
    color: white;
}

.social-icons {
    display: flex;
    gap: 18px;
    margin-top: 15px;
}

.social-icons a {
    width: 38px;
    height: 38px;
    border: 1px solid #555;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.social-icons a:hover {
    background: #d9b9ae;
    border-color: #d9b9ae;
    color: black;
}


.footer-bottom {
    border-top: 1px solid #292929;
    margin-top: 45px;
    padding-top: 20px;

    display: flex;
    justify-content: space-between;

    color: #777;
    font-size: 11px;
}

.back-top {
    color: #bbb;
}


@media (max-width: 900px) {

    .nav-links {
        gap: 20px;
    }

    .location-grid {
        grid-template-columns: 1fr;
        gap: 50px;
    }

    .footer-grid {
        grid-template-columns: 1fr 1fr;
    }
}


@media (max-width: 600px) {

    .navbar {
        height: 75px;
        padding: 0 5%;
    }

    .logo {
        font-size: 28px;
    }

    .nav-links {
        display: none;
    }

    .nav-icons {
        gap: 15px;
    }

    .location-hero {
        height: 330px;
        padding: 0 7%;
    }

    .hero-title {
        font-size: 55px;
    }

    .hero-description {
        font-size: 14px;
    }

    .location-section {
        padding: 55px 7%;
    }

    .section-title {
        font-size: 45px;
    }

    .map-container {
        height: 300px;
    }

    .footer-grid {
        grid-template-columns: 1fr;
        gap: 35px;
    }

    .footer-bottom {
        flex-direction: column;
        gap: 15px;
    }
}

</style>







</head>
<body>
    <h5>

        <p>Visit us</p>

    </h5>  

    <h1>

     LOCATION

    </h1>





</body>
</html>
